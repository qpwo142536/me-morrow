
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ME:MORROW | 내일의 나에게</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #F4F1EA;
      color: #292F36;
    }
    header {
      background: white;
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e8e3d9;
    }
    .logo {
      color: #2A4B7C;
      font-size: 22px;
      font-weight: bold;
    }
    .wrap {
      max-width: 900px;
      margin: 45px auto;
      padding: 0 20px;
    }
    h1 { font-size: 32px; }
    .point { color: #2A4B7C; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 25px 0;
    }
    .card {
      background: white;
      padding: 23px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 3px 15px #00000008;
    }
    .number { font-size: 30px; font-weight: bold; }
    input, button {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      font-size: 15px;
      margin-top: 10px;
    }
    input { border: 1px solid #ddd; }
    button {
      border: none;
      background: #2A4B7C;
      color: white;
      cursor: pointer;
    }
    button:hover { opacity: .85; }
    .done {
      background: #A8DADC;
      color: #263B3D;
    }
    .status { color: #2A4B7C; font-size: 13px; }
    @media(max-width:600px) {
      h1 { font-size: 25px; }
      .wrap { margin: 25px auto; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">ME:MORROW</div>
  <div>내일의 나에게, 심부름센터</div>
</header>

<main class="wrap">
  <p class="point">TODAY'S REQUEST OFFICE</p>
  <h1>내일의 나에게,<br>
    <span class="point">오늘의 의뢰를.</span>
  </h1>
  <p>오늘의 내가 맡긴 일들을 확인해 보세요.</p>

  <section class="stats">
    <div class="card">
      <p>전체 의뢰</p>
      <div class="number" id="total">0</div>
    </div>
    <div class="card">
      <p>완료한 의뢰</p>
      <div class="number" id="completed">0</div>
    </div>
  </section>

  <section class="card">
    <h2>새로운 의뢰 작성</h2>
    <input id="task" placeholder="어떤 일을 의뢰할까요?">
    <input id="date" type="date">
    <input id="time" type="time">
    <input id="reward" placeholder="완수 후 받을 보상 (선택)">
    <button onclick="addTask()">의뢰 발송하기</button>
  </section>

  <section>
    <h2>내가 보낸 의뢰</h2>
    <div id="taskList"></div>
  </section>
</main>

<script>
  let tasks = JSON.parse(
    localStorage.getItem("morrowTasks") || "[]"
  );

  function save() {
    localStorage.setItem(
      "morrowTasks", JSON.stringify(tasks)
    );
  }

  function addTask() {
    const title = document.getElementById("task").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const reward = document.getElementById("reward").value;

    if (!title || !date || !time) {
      alert("의뢰 내용, 날짜, 시간을 입력해 주세요.");
      return;
    }

    tasks.push({
      title, date, time, reward,
      status: "접수 대기"
    });

    save();
    document.getElementById("task").value = "";
    document.getElementById("date").value = "";
    document.getElementById("time").value = "";
    document.getElementById("reward").value = "";
    render();
    alert("미래의 나에게 의뢰를 발송했어요!");
  }

  function completeTask(index) {
    tasks[index].status = "완료됨";
    save();
    render();
  }

  function render() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    tasks.forEach((task, index) => {
      const card = document.createElement("div");
      card.className = "card";

      const title = document.createElement("h3");
      title.textContent = task.title;

      const detail = document.createElement("p");
      detail.textContent = task.date + " " + task.time;

      const reward = document.createElement("p");
      reward.textContent = task.reward
        ? "보상: " + task.reward : "보상 미설정";

      const status = document.createElement("p");
      status.className = "status";
      status.textContent = task.status;

      card.append(title, detail, reward, status);

      if (task.status !== "완료됨") {
        const btn = document.createElement("button");
        btn.className = "done";
        btn.textContent = "의뢰 완료하기";
        btn.onclick = () => completeTask(index);
        card.appendChild(btn);
      }

      list.appendChild(card);
    });

    document.getElementById("total").textContent =
      tasks.length;

    document.getElementById("completed").textContent =
      tasks.filter(t => t.status === "완료됨").length;
  }

  render();
</script>

</body>
</html>
