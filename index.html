<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F4F1EA">
  <title>ME:MORROW — 내일의 나에게, 심부름센터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" data-view="home">
        <span class="brand-mark">M<span>:</span></span>
        <span><b>ME:MORROW</b><small>YOUR FUTURE, ON CONTRACT</small></span>
      </a>
      <div class="side-label">WORKSPACE</div>
      <nav class="nav-list" aria-label="주 메뉴">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span>오늘의 접수창구</button>
        <button class="nav-item" data-view="requests"><span class="nav-icon">▤</span>미래로 보낸 의뢰</button>
        <button class="nav-item" data-view="replan"><span class="nav-icon">↗</span>미완료 & 재계획</button>
        <button class="nav-item" data-view="archive"><span class="nav-icon">▣</span>완료함 & 기록</button>
        <button class="nav-item" data-view="report"><span class="nav-icon">▥</span>성취 리포트</button>
      </nav>
      <div class="side-bottom">
        <div class="mini-card">
          <span class="mini-star">✳</span>
          <p>오늘의 나와<br><b>내일의 나를 연결해요.</b></p>
          <small>작은 약속부터 시작해 보세요.</small>
        </div>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>설정</button>
        <div class="profile"><div class="avatar-small">M</div><span><b>나의 미래 자아</b><small>계약 담당자</small></span><span class="online-dot"></span></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="mobile-brand">ME:MORROW <span>:</span></div>
        <div class="breadcrumb">ME:MORROW <span>/</span> <b id="pageCrumb">오늘의 접수창구</b></div>
        <div class="top-actions"><span class="today-date" id="todayDate"></span><button class="icon-button" id="helpBtn" aria-label="도움말">?</button></div>
      </header>
      <div class="content" id="appContent"></div>
      <footer class="footer">ME:MORROW <span>·</span> 현재의 내가 미래의 나를 고용한다.</footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal-backdrop" id="modalBackdrop" hidden><section class="modal" id="modal" role="dialog" aria-modal="true"></section></div>
  <script src="js/app.js"></script>
</body>
</html>
